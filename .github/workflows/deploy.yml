name: Deploy Ratsia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package.json
      - name: Install
        working-directory: client
        run: npm ci
      - name: Build (VITE_SERVER_URL)
        working-directory: client
        run: npm run build
        env:
          # Agar tunnel URL ni GitHub Secrets ga qo'ysangiz avtomatik oladi, bo'lmasa default localhost bo'ladi va
          # foydalanuvchi brauzerda ⚙ orqali o'zgartira oladi
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL || vars.VITE_SERVER_URL || 'https://example.trycloudflare.com' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - uses: actions/deploy-pages@v4
